<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 编解码 - DevToolbox</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="navbar-brand" style="text-decoration:none;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0071e3"/>
        <path d="M8 16L14 22L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DevToolbox</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header fade-in">
      <div style="font-size:48px;margin-bottom:16px;">🔗</div>
      <h1>URL 编解码</h1>
      <p>URL 编码与解码，支持批量处理和组件级别编码。</p>
    </div>

    <div class="tool-content">

      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>输入内容</h4>
          <button class="btn btn-ghost" data-action="clear" data-input="urlInput" data-output="urlOutput">清空</button>
        </div>
        <textarea id="urlInput" class="io-textarea" style="min-height:100px;" placeholder="输入 URL 或文本，例如：https://example.com/?q=你好&name=测试"></textarea>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
          <button class="btn btn-primary" data-action="execute" onclick="urlEncode()">编码（文本→URL）</button>
          <button class="btn btn-secondary" onclick="urlDecode()">解码（URL→文本）</button>
          <button class="btn btn-ghost" onclick="urlEncodeComponent()" style="font-size:13px;padding:8px 14px;">组件编码</button>
        </div>
      </div>

      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>结果</h4>
          <button class="btn btn-ghost" data-action="copy-result" data-target="urlOutput">复制</button>
        </div>
        <div id="urlOutput" class="io-result" style="min-height:60px;">结果将显示在此处…</div>
      </div>

      <!-- 说明 -->
      <div class="io-card fade-in">
        <div class="io-card-header"><h4>编码区别说明</h4></div>
        <pre style="font-size:13px;line-height:1.8;color:var(--color-text-secondary);white-space:pre-wrap;">
encodeURI()      保留：A-Z a-z 0-9 - _ . ! ~ * ' ( )
                保留：; / ? : @ & = + $ , #
                编码：中文、空格、特殊字符

encodeURIComponent()
                编码：所有非标准字符（包括 : / ? 等）

推荐：完整 URL 用 encodeURI
        </pre>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/tools/url-encode.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
