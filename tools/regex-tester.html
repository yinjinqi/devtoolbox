<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正则表达式测试 - DevToolbox</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="navbar-brand" style="text-decoration:none;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0071e3"/>
        <path d="M8 16L14 22L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DevToolbox</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header fade-in">
      <div style="font-size:48px;margin-bottom:16px;">.*</div>
      <h1>正则表达式测试</h1>
      <p>实时测试正则表达式，高亮匹配结果，内置超时保护。</p>
    </div>

    <div class="tool-content">

      <!-- 正则输入 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>正则表达式</h4>
          <div style="display:flex;gap:8px;align-items:center;">
            <label style="font-size:13px;color:var(--color-text-tertiary);">标志：</label>
            <label style="font-size:13px;display:flex;align-items:center;gap:2px;">
              <input type="checkbox" id="flagG" checked> g
            </label>
            <label style="font-size:13px;display:flex;align-items:center;gap:2px;">
              <input type="checkbox" id="flagI"> i
            </label>
            <label style="font-size:13px;display:flex;align-items:center;gap:2px;">
              <input type="checkbox" id="flagM"> m
            </label>
          </div>
        </div>
        <input type="text" id="regexInput" class="search-box" style="width:100%;margin-bottom:12px;"
          placeholder="输入正则表达式，例如：\d+ 或 (\w+)@(\w+)\.(\w+)" autocomplete="off">
        <textarea id="testString" class="io-textarea" style="min-height:120px;" placeholder="输入要测试的文本…"></textarea>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
          <button class="btn btn-primary" data-action="execute" onclick="testRegex()">测试匹配</button>
          <button class="btn btn-secondary" onclick="loadRegexSample()">加载示例</button>
          <button class="btn btn-ghost" data-action="clear" data-input="regexInput" data-output="regexResult">清空</button>
        </div>
      </div>

      <!-- 匹配结果 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>匹配结果</h4>
          <span id="matchCount" style="font-size:13px;color:var(--color-text-tertiary);"></span>
        </div>
        <div id="regexResult" class="io-result" style="min-height:80px;">匹配结果将显示在此处…</div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/tools/regex-tester.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
