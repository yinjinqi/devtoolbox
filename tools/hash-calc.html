<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash 计算 - DevToolbox</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="navbar-brand" style="text-decoration:none;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0071e3"/>
        <path d="M8 16L14 22L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DevToolbox</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header fade-in">
      <div style="font-size:48px;margin-bottom:16px;">#</div>
      <h1>Hash 计算</h1>
      <p>计算文本或文件的 MD5 / SHA1 / SHA256 / SHA512 哈希值。</p>
    </div>

    <div class="tool-content">

      <!-- 文本 Hash -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>文本 Hash 计算</h4>
        </div>
        <textarea id="hashInput" class="io-textarea" style="min-height:100px;" placeholder="输入要计算 Hash 的文本…"></textarea>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center;">
          <label style="font-size:14px;color:var(--color-text-secondary);">算法：</label>
          <label style="font-size:14px;display:flex;align-items:center;gap:4px;">
            <input type="checkbox" class="hash-algo" value="MD5" checked> MD5
          </label>
          <label style="font-size:14px;display:flex;align-items:center;gap:4px;">
            <input type="checkbox" class="hash-algo" value="SHA-1" checked> SHA-1
          </label>
          <label style="font-size:14px;display:flex;align-items:center;gap:4px;">
            <input type="checkbox" class="hash-algo" value="SHA-256" checked> SHA-256
          </label>
          <label style="font-size:14px;display:flex;align-items:center;gap:4px;">
            <input type="checkbox" class="hash-algo" value="SHA-512"> SHA-512
          </label>
          <button class="btn btn-primary" data-action="execute" onclick="calcTextHash()">计算</button>
          <button class="btn btn-ghost" data-action="clear" data-input="hashInput" data-output="hashOutput">清空</button>
        </div>
        <div id="hashOutput" class="io-result" style="margin-top:16px;min-height:60px;">计算结果将显示在此处…</div>
      </div>

      <!-- 文件 Hash -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>文件 Hash 计算</h4>
        </div>
        <div style="margin-bottom:16px;">
          <input type="file" id="hashFileInput" style="font-size:14px;color:var(--color-text-secondary);">
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
          <label style="font-size:14px;color:var(--color-text-secondary);">算法：</label>
          <select id="fileHashAlgo" style="padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg-tertiary);color:var(--color-text-primary);font-size:14px;">
            <option value="SHA-256" selected>SHA-256</option>
            <option value="SHA-512">SHA-512</option>
            <option value="SHA-1">SHA-1</option>
            <option value="MD5">MD5</option>
          </select>
          <button class="btn btn-primary" onclick="calcFileHash()">计算文件 Hash</button>
        </div>
        <div id="fileHashOutput" class="io-result" style="margin-top:16px;min-height:40px;">选择文件后将显示 Hash 值…</div>
        <div id="fileHashProgress" style="margin-top:8px;font-size:13px;color:var(--color-text-tertiary);display:none;">计算中…</div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Web Crypto API 无需 CDN -->
  <script src="../js/utils.js"></script>
  <script src="../js/tools/hash-calc.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
