<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID 生成器 - DevToolbox</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="navbar-brand" style="text-decoration:none;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0071e3"/>
        <path d="M8 16L14 22L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DevToolbox</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header fade-in">
      <div style="font-size:48px;margin-bottom:16px;">🔑</div>
      <h1>UUID 生成器</h1>
      <p>生成 v4 UUID（随机），支持批量生成和格式自定义。</p>
    </div>

    <div class="tool-content">

      <!-- 生成控制 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>生成设置</h4>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">
          <label style="font-size:14px;color:var(--color-text-secondary);">生成数量：</label>
          <input type="number" id="uuidCount" value="1" min="1" max="100"
            style="width:80px;padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg-tertiary);color:var(--color-text-primary);font-size:14px;">
          <label style="font-size:14px;color:var(--color-text-secondary);margin-left:8px;">格式：</label>
          <select id="uuidFormat" style="padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg-tertiary);color:var(--color-text-primary);font-size:14px;">
            <option value="lower">小写（默认）</option>
            <option value="upper">大写</option>
            <option value="no-dash">无连字符</option>
          </select>
          <button class="btn btn-primary" data-action="execute" onclick="generateUUIDs()">生成</button>
        </div>
        <button class="btn btn-secondary" onclick="generateUUIDs()" style="width:100%;">🔄 重新生成</button>
      </div>

      <!-- 结果 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>生成结果</h4>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" data-action="copy-result" data-target="uuidResult">全部复制</button>
            <button class="btn btn-ghost" data-action="clear" data-output="uuidResult">清空</button>
          </div>
        </div>
        <div id="uuidResult" class="io-result" style="min-height:100px;">
          点击「生成」按钮，UUID 将显示在此处…
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/tools/uuid-gen.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
