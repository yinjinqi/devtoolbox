<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 编解码 - DevToolbox</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="navbar-brand" style="text-decoration:none;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0071e3"/>
        <path d="M8 16L14 22L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DevToolbox</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header fade-in">
      <div style="font-size:48px;margin-bottom:16px;">📄</div>
      <h1>Base64 编解码</h1>
      <p>文本和文件的 Base64 编码与解码，支持大文件分片处理。</p>
    </div>

    <div class="tool-content">

      <!-- 文本编解码 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>文本 Base64 编解码</h4>
        </div>
        <textarea id="b64Input" class="io-textarea" style="min-height:120px;" placeholder="输入文本或 Base64 字符串…"></textarea>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
          <button class="btn btn-primary" data-action="execute" onclick="b64Encode()">编码（文本→Base64）</button>
          <button class="btn btn-secondary" onclick="b64Decode()">解码（Base64→文本）</button>
          <button class="btn btn-ghost" data-action="clear" data-input="b64Input" data-output="b64Output">清空</button>
        </div>
        <div style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:14px;font-weight:600;">结果</span>
            <button class="btn btn-ghost" data-action="copy-result" data-target="b64Output" style="font-size:13px;">复制</button>
          </div>
          <div id="b64Output" class="io-result" style="min-height:60px;">结果将显示在此处…</div>
        </div>
      </div>

      <!-- 文件编解码 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>文件 Base64 编解码</h4>
        </div>
        <div style="margin-bottom:16px;">
          <input type="file" id="b64FileInput" style="font-size:14px;color:var(--color-text-secondary);">
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="b64EncodeFile()">文件编码为 Base64</button>
          <button class="btn btn-secondary" onclick="b64DecodeToFile()">Base64 解码为文件</button>
        </div>
        <div style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:14px;font-weight:600;">文件结果</span>
            <span id="b64FileInfo" style="font-size:13px;color:var(--color-text-tertiary);"></span>
          </div>
          <div id="b64FileOutput" class="io-result" style="min-height:60px;">选择文件后将显示 Base64 结果…</div>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/tools/base64.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
