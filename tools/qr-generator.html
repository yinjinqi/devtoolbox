<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码生成 - DevToolbox</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="navbar-brand" style="text-decoration:none;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0071e3"/>
        <path d="M8 16L14 22L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DevToolbox</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header fade-in">
      <div style="font-size:48px;margin-bottom:16px;">▣</div>
      <h1>二维码生成</h1>
      <p>将文本或链接转换为二维码，支持自定义尺寸和容错级别。</p>
    </div>

    <div class="tool-content">

      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>输入内容</h4>
          <button class="btn btn-ghost" data-action="clear" data-input="qrInput" data-output="qrOutput">清空</button>
        </div>
        <textarea id="qrInput" class="io-textarea" style="min-height:100px;" placeholder="输入文本或链接，例如：https://example.com"></textarea>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px;">
          <label style="font-size:14px;color:var(--color-text-secondary);">尺寸：</label>
          <select id="qrSize" style="padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg-tertiary);color:var(--color-text-primary);font-size:14px;">
            <option value="128">128 × 128</option>
            <option value="256" selected>256 × 256</option>
            <option value="512">512 × 512</option>
          </select>
          <label style="font-size:14px;color:var(--color-text-secondary);margin-left:8px;">容错：</label>
          <select id="qrEC" style="padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg-tertiary);color:var(--color-text-primary);font-size:14px;">
            <option value="L">低（L）</option>
            <option value="M" selected>中（M）</option>
            <option value="H">高（H）</option>
          </select>
          <button class="btn btn-primary" data-action="execute" onclick="generateQR()">生成二维码</button>
        </div>
      </div>

      <!-- 二维码结果 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>二维码</h4>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" onclick="downloadQR()" style="font-size:13px;">下载 PNG</button>
          </div>
        </div>
        <div id="qrOutput" style="display:flex;justify-content:center;align-items:center;min-height:200px;background:var(--color-bg-tertiary);border-radius:var(--radius-md);">
          二维码将在此处显示…
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- qrcode.js CDN + fallback -->
  <script>
    let qrLoaded = false;
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
    s.onload = () => { qrLoaded = true; };
    s.onerror = () => {
      const s2 = document.createElement('script');
      s2.src = 'https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s2.onload = () => { qrLoaded = true; };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  </script>
  <script src="../js/utils.js"></script>
  <script src="../js/tools/qr-generator.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
