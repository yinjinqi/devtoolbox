<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>颜色转换 - DevToolbox</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand" style="text-decoration:none;">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#0071e3"/>
        <path d="M8 16L14 22L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DevToolbox</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题"></button>
  </nav>

  <div class="tool-page">
    <div class="tool-header fade-in">
      <div style="font-size:48px;margin-bottom:16px;">🎨</div>
      <h1>颜色转换</h1>
      <p>HEX、RGB、HSL 颜色格式互转，实时预览和调色盘。</p>
    </div>

    <div class="tool-content">

      <!-- 输入区 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>输入颜色值</h4>
          <button class="btn btn-ghost" data-action="clear" data-input="colorInput" data-output="colorOutput">清空</button>
        </div>
        <input type="text" id="colorInput" class="search-box" style="width:100%;margin-bottom:16px;"
          placeholder="输入颜色值，例如：#ff5733 或 rgb(255,87,51)" autocomplete="off">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">
          <label style="font-size:14px;color:var(--color-text-secondary);">快速选择：</label>
          <input type="color" id="colorPicker" value="#ff5733" onchange="onColorPickerChange()" style="width:40px;height:32px;border:none;background:none;cursor:pointer;">
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="setColor('#0071e3')">苹果蓝</button>
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="setColor('#34c759')">苹果绿</button>
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="setColor('#ff3b30')">苹果红</button>
          <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="setColor('#ff9500')">橙色</button>
        </div>
        <button class="btn btn-primary" data-action="execute" onclick="convertColor()">转换</button>
      </div>

      <!-- 结果区 -->
      <div class="io-card fade-in">
        <div class="io-card-header">
          <h4>转换结果</h4>
          <button class="btn btn-ghost" data-action="copy-result" data-target="colorOutput">复制结果</button>
        </div>
        <!-- 颜色预览块 -->
        <div id="colorPreview" style="width:100%;height:80px;border-radius:var(--radius-md);margin-bottom:16px;border:1px solid var(--color-border-light);"></div>
        <div id="colorOutput" class="io-result" style="min-height:100px;">转换结果将显示在此处…</div>
      </div>

      <!-- 格式说明 -->
      <div class="io-card fade-in">
        <div class="io-card-header"><h4>格式说明</h4></div>
        <pre style="font-size:13px;line-height:1.8;color:var(--color-text-secondary);white-space:pre-wrap;background:none;padding:0;">
HEX：  #RRGGBB（十六进制，如 #ff5733）
RGB：  rgb(R, G, B)（每个值 0-255）
HSL：  hsl(H, S%, L%)（色相 0-360，饱和度/亮度 0-100%）

示例：
  HEX：  #ff5733
  RGB：  rgb(255, 87, 51)
  HSL：  hsl(14, 100%, 60%)
        </pre>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/tools/color-convert.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
